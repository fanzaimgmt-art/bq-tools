<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obra — CRM Pipeline</title>
<meta name="description" content="Your contractor sales pipeline — leads, quotes, follow-ups, all in one place. Part of Obra.">
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; }
  .crm-wrap { width: 96%; max-width: 1200px; margin: 0 auto; padding: 20px 0 60px; }
  .crm-top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 18px; }
  .crm-top h1 { font-size: 24px; font-weight: 900; }
  .crm-stat { background: var(--sf); border: 1px solid var(--bd); border-radius: 10px; padding: 8px 14px; }
  .crm-stat .l { font-size: 11px; color: var(--txd); text-transform: uppercase; letter-spacing: .5px; }
  .crm-stat .v { font-size: 18px; font-weight: 800; color: var(--ac); }
  .crm-spacer { flex: 1; }
  /* Board */
  .crm-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: start; }
  .crm-col { background: var(--bg); border: 1px solid var(--bd); border-radius: 12px; padding: 10px; min-height: 120px; transition: background .15s, border-color .15s; }
  .crm-col.dragover { border-color: var(--ac); background: var(--acd); }
  .crm-col-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
  .crm-col-head .name { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
  .crm-col-head .meta { font-size: 12px; color: var(--txd); }
  .crm-col[data-stage="won"] .name { color: var(--grn, #34d399); }
  .crm-col[data-stage="lost"] .name { color: var(--red, #f87171); }
  .crm-card { background: var(--sf); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s, transform .1s; }
  .crm-card:hover { border-color: var(--ac); }
  .crm-card:active { transform: scale(.99); }
  .crm-card .t { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
  .crm-card .v { font-size: 13px; font-weight: 800; color: var(--ac); }
  .crm-card .c { font-size: 12px; color: var(--txd); margin-top: 4px; }
  .crm-empty { font-size: 12px; color: var(--txd); text-align: center; padding: 16px 0; opacity: .6; }
  /* Modal / drawer */
  .crm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
  .crm-overlay.open { display: flex; }
  .crm-modal { background: var(--sf); border: 1px solid var(--bd); border-radius: 16px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; padding: 22px; }
  .crm-modal h2 { font-size: 18px; font-weight: 800; margin-bottom: 14px; }
  .crm-field { margin-bottom: 12px; }
  .crm-field label { display: block; font-size: 12px; color: var(--txd); font-weight: 700; margin-bottom: 5px; }
  .crm-field input, .crm-field select, .crm-field textarea {
    width: 100%; padding: 11px 13px; border: 1px solid var(--bd); border-radius: 9px;
    background: var(--bg); color: var(--tx); font-family: var(--font-en); font-size: 16px; box-sizing: border-box;
  }
  .crm-field input:focus, .crm-field select:focus, .crm-field textarea:focus { outline: none; border-color: var(--ac); }
  .crm-row2 { display: flex; gap: 10px; }
  .crm-row2 > * { flex: 1; }
  .crm-timeline { margin-top: 6px; }
  .crm-act { font-size: 13px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .crm-act .when { font-size: 11px; color: var(--txd); }
  .crm-act .badge { font-size: 10px; text-transform: uppercase; color: var(--ac); font-weight: 700; margin-inline-end: 6px; }
  .crm-task { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 0; }
  .crm-task input { width: 18px; height: 18px; }
  .crm-task.done span { text-decoration: line-through; opacity: .5; }
  .crm-close { float: inline-end; background: none; border: none; color: var(--txd); font-size: 22px; cursor: pointer; line-height: 1; }
  @media (max-width: 800px) { .crm-board { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .crm-board { grid-template-columns: 1fr; } }
</style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e8c547">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Obra">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
</head>
<body>

<nav class="nav">
  <a href="/home" class="nav-logo">Obra</a>
  <div class="nav-right">
    <a href="/home" class="nav-link" data-en="Tools" data-he="כלים" data-es="Herramientas">Tools</a>
    <button class="theme-toggle" onclick="openLangPicker()" title="Language" aria-label="Choose language">🌐</button>
  </div>
</nav>

<div class="crm-wrap">
  <div class="crm-top">
    <h1 data-en="Pipeline" data-he="צינור מכירות" data-es="Embudo">Pipeline</h1>
    <div class="crm-stat"><div class="l" data-en="Pipeline" data-he="בצינור" data-es="En embudo">Pipeline</div><div class="v" id="statPipe">$0</div></div>
    <div class="crm-stat"><div class="l" data-en="Forecast" data-he="תחזית" data-es="Pronóstico">Forecast</div><div class="v" id="statForecast">$0</div></div>
    <div class="crm-spacer"></div>
    <button class="btn btn-sm" onclick="importClients()" data-en="↓ Import clients" data-he="↓ ייבוא לקוחות" data-es="↓ Importar clientes" title="Pull your existing clients into the pipeline">↓ Import clients</button>
    <button class="btn btn-primary" onclick="openNewDeal()" data-en="+ New Deal" data-he="+ עסקה חדשה" data-es="+ Nuevo Trato">+ New Deal</button>
  </div>
  <div class="crm-board" id="board"></div>
</div>

<!-- New deal modal -->
<div class="crm-overlay" id="newDealOverlay">
  <div class="crm-modal">
    <button class="crm-close" onclick="closeOverlay('newDealOverlay')">&times;</button>
    <h2 data-en="New Deal" data-he="עסקה חדשה" data-es="Nuevo Trato">New Deal</h2>
    <div class="crm-field"><label data-en="Title" data-he="כותרת" data-es="Título">Title</label><input id="nd_title" maxlength="200" placeholder="Kitchen remodel — Smith"></div>
    <div class="crm-row2">
      <div class="crm-field"><label data-en="Value ($)" data-he="ערך ($)" data-es="Valor ($)">Value ($)</label><input id="nd_value" type="number" inputmode="decimal" placeholder="12000"></div>
      <div class="crm-field"><label data-en="Stage" data-he="שלב" data-es="Etapa">Stage</label><select id="nd_stage"><option value="new">New</option><option value="quoted">Quoted</option><option value="won">Won</option><option value="lost">Lost</option></select></div>
    </div>
    <div class="crm-field"><label data-en="Contact name" data-he="שם איש קשר" data-es="Nombre">Contact name</label><input id="nd_name" maxlength="100" placeholder="John Smith"></div>
    <div class="crm-row2">
      <div class="crm-field"><label data-en="Phone" data-he="טלפון" data-es="Teléfono">Phone</label><input id="nd_phone" maxlength="40"></div>
      <div class="crm-field"><label data-en="Company" data-he="חברה" data-es="Empresa">Company</label><input id="nd_company" maxlength="120"></div>
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="createDeal()" id="nd_btn" data-en="Create" data-he="צור" data-es="Crear">Create</button>
    <div id="nd_err" style="color:var(--red);font-size:13px;margin-top:8px;text-align:center;"></div>
  </div>
</div>

<!-- Deal detail drawer -->
<div class="crm-overlay" id="dealOverlay">
  <div class="crm-modal" id="dealModal"></div>
</div>

<script src="/js/i18n-dict.js" defer></script>
<script src="js/ai.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script>
const CRM_API = 'https://bq-tools-api.fanzai-mgmt.workers.dev';
const STAGE_LABELS = { new: {en:'New',he:'חדש',es:'Nuevo'}, quoted: {en:'Quoted',he:'הצעה',es:'Cotizado'}, won: {en:'Won',he:'נסגר',es:'Ganado'}, lost: {en:'Lost',he:'אבד',es:'Perdido'} };
function _tok() { return (typeof getToken === 'function' && getToken()) || localStorage.getItem('bq_token'); }
function _H() { return { 'Authorization': 'Bearer ' + _tok(), 'Content-Type': 'application/json' }; }
function fmt$(n) { n = Number(n)||0; return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 }); }
function L(o) { return (typeof t === 'function') ? t(o) : o.en; }

// Require login
if (!_tok()) location.replace('/auth?next=/crm');

async function loadPipeline() {
  try {
    const r = await fetch(`${CRM_API}/api/crm/pipeline`, { headers: _H() });
    if (r.status === 401) { location.replace('/auth?next=/crm'); return; }
    const d = await r.json();
    renderBoard(d);
  } catch (e) {
    document.getElementById('board').innerHTML = '<div class="crm-empty">Could not load. Retry.</div>';
  }
}

function renderBoard(d) {
  document.getElementById('statPipe').textContent = fmt$((d.totals.new||0) + (d.totals.quoted||0));
  document.getElementById('statForecast').textContent = fmt$(d.forecast);
  const board = document.getElementById('board');
  board.innerHTML = d.stages.map(s => {
    const deals = d.deals[s] || [];
    const cards = deals.length ? deals.map(dealCard).join('') : `<div class="crm-empty" data-en="Drop here" data-he="גרור לכאן" data-es="Arrastra aquí">Drop here</div>`;
    return `<div class="crm-col" data-stage="${s}" ondragover="colDragOver(event)" ondragleave="colDragLeave(event)" ondrop="colDrop(event,'${s}')">
      <div class="crm-col-head"><span class="name" data-en="${STAGE_LABELS[s].en}" data-he="${STAGE_LABELS[s].he}" data-es="${STAGE_LABELS[s].es}">${L(STAGE_LABELS[s])}</span><span class="meta">${deals.length} · ${fmt$(d.totals[s])}</span></div>
      ${cards}
    </div>`;
  }).join('');
  if (typeof setLang === 'function') setLang(localStorage.getItem('bq_lang') || 'en');
}

function dealCard(dl) {
  const contact = dl.contact_name ? `<div class="c">👤 ${escapeHtml(dl.contact_name)}${dl.contact_company ? ' · ' + escapeHtml(dl.contact_company) : ''}</div>` : '';
  return `<div class="crm-card" draggable="true" ondragstart="cardDrag(event,${dl.id})" onclick="openDeal(${dl.id})">
    <div class="t">${escapeHtml(dl.title)}</div>
    <div class="v">${fmt$(dl.value)}</div>${contact}
  </div>`;
}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// Drag-drop → move stage
let _dragId = null;
function cardDrag(e, id) { _dragId = id; e.dataTransfer.effectAllowed = 'move'; }
function colDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('dragover'); }
function colDragLeave(e) { e.currentTarget.classList.remove('dragover'); }
async function colDrop(e, stage) {
  e.preventDefault(); e.currentTarget.classList.remove('dragover');
  const id = _dragId; _dragId = null; // reset now so a failed drop can't move the wrong deal next time
  if (!id) return;
  await _crmWrite(`${CRM_API}/api/crm/deal`, { method: 'PATCH', headers: _H(), body: JSON.stringify({ id, stage }) });
  loadPipeline(); // always re-sync from server (shows the move, or reverts a failed one)
}

async function importClients() {
  if (!confirm(L({en:'Import your existing clients into the pipeline?',he:'לייבא את הלקוחות הקיימים שלך לפייפליין?',es:'¿Importar tus clientes existentes al embudo?'}))) return;
  const r = await fetch(`${CRM_API}/api/crm/import-clients`, { method:'POST', headers:_H() });
  const d = await r.json();
  alert(L({en:`Imported ${d.imported||0} client(s).`,he:`יובאו ${d.imported||0} לקוחות.`,es:`Importados ${d.imported||0} cliente(s).`}));
  loadPipeline();
}

// New deal
function openNewDeal() { document.getElementById('nd_err').textContent = ''; document.getElementById('newDealOverlay').classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }
async function createDeal() {
  const title = document.getElementById('nd_title').value.trim();
  if (!title) { document.getElementById('nd_err').textContent = L({en:'Title required',he:'כותרת חובה',es:'Título requerido'}); return; }
  const btn = document.getElementById('nd_btn'); btn.disabled = true;
  const payload = {
    title, value: document.getElementById('nd_value').value, stage: document.getElementById('nd_stage').value,
    name: document.getElementById('nd_name').value.trim(), phone: document.getElementById('nd_phone').value.trim(),
    company: document.getElementById('nd_company').value.trim(), source: 'manual'
  };
  try {
    const r = await fetch(`${CRM_API}/api/crm/deal`, { method: 'POST', headers: _H(), body: JSON.stringify(payload) });
    if (r.status === 401) { location.replace('/auth?next=/crm'); return; }
    if (r.ok) { ['nd_title','nd_value','nd_name','nd_phone','nd_company'].forEach(i=>document.getElementById(i).value=''); closeOverlay('newDealOverlay'); loadPipeline(); }
    else { let m = 'Error'; try { m = (await r.json()).error || m; } catch (_) {} document.getElementById('nd_err').textContent = m; }
  } catch (_) {
    document.getElementById('nd_err').textContent = L({en:'Network error — please retry.',he:'תקלת רשת — נסה שוב.',es:'Error de red — reintenta.'});
  } finally {
    btn.disabled = false; // always re-enable, even if fetch threw (was stuck-disabled on network error)
  }
}

// Deal detail
async function openDeal(id) {
  const r = await fetch(`${CRM_API}/api/crm/deal?id=${id}`, { headers: _H() });
  if (!r.ok) return;
  const { deal, activities, tasks } = await r.json();
  const stageOpts = Object.keys(STAGE_LABELS).map(s => `<option value="${s}"${s===deal.stage?' selected':''}>${L(STAGE_LABELS[s])}</option>`).join('');
  const acts = activities.length ? activities.map(a => `<div class="crm-act"><span class="badge">${escapeHtml(a.type)}</span>${escapeHtml(a.body||'')}<div class="when">${new Date(a.created_at+'Z').toLocaleString()}</div></div>`).join('') : `<div class="crm-empty" data-en="No activity yet" data-he="אין פעילות" data-es="Sin actividad">No activity yet</div>`;
  const taskList = tasks.length ? tasks.map(tk => `<div class="crm-task ${tk.done?'done':''}"><input type="checkbox" ${tk.done?'checked':''} onchange="toggleTask(${tk.id},this.checked,${id})"><span>${escapeHtml(tk.title)}${tk.due_at?' · '+escapeHtml(tk.due_at):''}</span></div>`).join('') : '';
  document.getElementById('dealModal').innerHTML = `
    <button class="crm-close" onclick="closeOverlay('dealOverlay')">&times;</button>
    <h2>${escapeHtml(deal.title)}</h2>
    <div class="crm-row2">
      <div class="crm-field"><label data-en="Stage" data-he="שלב">Stage</label><select onchange="moveStage(${id},this.value)">${stageOpts}</select></div>
      <div class="crm-field"><label data-en="Value ($)" data-he="ערך ($)">Value ($)</label><input type="number" value="${Number(deal.value) || 0}" onchange="updateValue(${id},this.value)"></div>
    </div>
    ${deal.contact_name ? `<div class="crm-field"><label data-en="Contact" data-he="איש קשר">Contact</label><div>👤 ${escapeHtml(deal.contact_name)}${deal.contact_phone?` · <a href="tel:${escapeHtml(deal.contact_phone)}">${escapeHtml(deal.contact_phone)}</a>`:''}${deal.contact_email?` · <a href="mailto:${escapeHtml(deal.contact_email)}">${escapeHtml(deal.contact_email)}</a>`:''}</div></div>` : ''}
    <div class="crm-field"><label data-en="Follow-ups" data-he="מעקבים" data-es="Seguimientos">Follow-ups</label>
      <div id="dealTasks">${taskList}</div>
      <div class="crm-row2" style="margin-top:6px;"><input id="newTaskTitle" placeholder="${L({en:'Add a follow-up…',he:'הוסף מעקב…',es:'Añadir seguimiento…'})}"><input id="newTaskDue" type="date" style="max-width:150px;"></div>
      <button class="btn btn-sm" style="margin-top:6px;" onclick="addTask(${id})" data-en="+ Task" data-he="+ משימה" data-es="+ Tarea">+ Task</button>
    </div>
    <div class="crm-field"><label data-en="Activity" data-he="פעילות" data-es="Actividad">Activity</label>
      <div class="crm-timeline">${acts}</div>
      <div class="crm-row2" style="margin-top:6px;"><input id="newActBody" placeholder="${L({en:'Log a call, note…',he:'תעד שיחה, הערה…',es:'Registra una llamada…'})}"><button class="btn btn-sm" onclick="addActivity(${id})" data-en="Log" data-he="תעד" data-es="Registrar">Log</button></div>
    </div>
    <button onclick="deleteDeal(${id})" style="background:none;border:none;color:var(--red);font-size:13px;cursor:pointer;margin-top:8px;" data-en="🗑 Delete deal" data-he="🗑 מחק עסקה" data-es="🗑 Eliminar trato">🗑 Delete deal</button>`;
  document.getElementById('dealOverlay').classList.add('open');
  if (typeof setLang === 'function') setLang(localStorage.getItem('bq_lang') || 'en');
}
// Centralized write: surface failures instead of silently no-opping. On 401 → re-auth; on any other
// failure → alert + return null so callers can revert optimistic UI (e.g. a toggled checkbox).
async function _crmWrite(url, opts) {
  let r;
  try { r = await fetch(url, opts); }
  catch (_) { alert(L({en:'Network error — please retry.',he:'תקלת רשת — נסה שוב.',es:'Error de red — reintenta.'})); return null; }
  if (r.status === 401) { location.replace('/auth?next=/crm'); return null; }
  if (!r.ok) { alert(L({en:'Could not save — please retry.',he:'השמירה נכשלה — נסה שוב.',es:'No se pudo guardar — reintenta.'})); return null; }
  return r;
}
async function moveStage(id, stage) { if (await _crmWrite(`${CRM_API}/api/crm/deal`, { method:'PATCH', headers:_H(), body: JSON.stringify({id, stage}) })) loadPipeline(); else loadPipeline(); }
async function updateValue(id, value) { if (await _crmWrite(`${CRM_API}/api/crm/deal`, { method:'PATCH', headers:_H(), body: JSON.stringify({id, value}) })) loadPipeline(); }
async function addActivity(id) { const b=document.getElementById('newActBody').value.trim(); if(!b)return; if (await _crmWrite(`${CRM_API}/api/crm/activity`,{method:'POST',headers:_H(),body:JSON.stringify({deal_id:id,body:b,type:'note'})})) openDeal(id); }
async function addTask(id) { const tt=document.getElementById('newTaskTitle').value.trim(); if(!tt)return; const due=document.getElementById('newTaskDue').value; if (await _crmWrite(`${CRM_API}/api/crm/task`,{method:'POST',headers:_H(),body:JSON.stringify({deal_id:id,title:tt,due_at:due||null})})) openDeal(id); }
async function toggleTask(tid, done, dealId) { if (!(await _crmWrite(`${CRM_API}/api/crm/task`,{method:'PATCH',headers:_H(),body:JSON.stringify({id:tid,done})}))) openDeal(dealId); } // revert checkbox on failure
async function deleteDeal(id) {
  if (!confirm(L({en:'Delete this deal?',he:'למחוק את העסקה?',es:'¿Eliminar este trato?'}))) return;
  if (await _crmWrite(`${CRM_API}/api/crm/deal?id=${id}`, { method:'DELETE', headers:_H() })) { closeOverlay('dealOverlay'); loadPipeline(); }
}

document.addEventListener('DOMContentLoaded', () => { if (_tok()) loadPipeline(); });
</script>
</body>
</html>
