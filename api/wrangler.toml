name = "bq-tools-api"
main = "worker.js"
compatibility_date = "2024-09-25"

[vars]
CLAUDE_MODEL = "claude-haiku-4-5-20251001"
GEMINI_MODEL = "gemini-2.5-flash"
GEMINI_MODEL_FALLBACK = "gemini-2.0-flash"
ALLOWED_ORIGIN = "https://bq-tools.fanzai-mgmt.workers.dev"
FREE_CREDITS = "5"
GOOGLE_CLIENT_ID = "704767034441-ljp9b1a874bdi9rqpodr8p4l5rmvbtdj.apps.googleusercontent.com"
STRIPE_ENABLED = "true"
MOSHE_CHAT_ID = "369310707"

[[kv_namespaces]]
binding = "BQ_USERS"
id = "e75722f0f0f44c1994c95bc98b4386a9"

# Native rate-limit binding — atomic/burst-proof (unlike eventually-consistent KV counters).
# 5 requests / 60s per key. Used for verify + register brute-force protection.
[[unsafe.bindings]]
name = "AUTH_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[triggers]
# 8am PT = 16:00 UTC. Runs: news refresh + scrape 20 new contractors + re-engagement + analytics digest.
crons = ["0 16 * * *"]
