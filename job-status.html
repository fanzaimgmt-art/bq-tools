<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Status — BQ Tools</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e8c547">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* Zero-login client-facing page — clean, trust-building */
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--bg);
    color: var(--tx);
  }

  .js-page {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 48px;
    width: 100%;
    box-sizing: border-box;
  }

  /* Header: BQ Tools brand mark */
  .js-brand {
    text-align: center;
    padding: 20px 0 8px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -.01em;
    color: var(--ac);
  }
  .js-brand span { color: var(--txd); font-weight: 400; font-size: 13px; }

  /* Contractor info card */
  .contractor-card {
    background: var(--sf);
    border: 1px solid var(--bd);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .contractor-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--acd); border: 2px solid var(--ac);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: var(--ac);
    flex-shrink: 0;
  }
  .contractor-info h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .contractor-contact a {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--ac); text-decoration: none; font-size: 13px; font-weight: 600;
    margin-inline-end: 12px;
  }
  .contractor-contact a:hover { text-decoration: underline; }

  /* Job title */
  .job-title {
    font-size: 22px; font-weight: 900; margin-bottom: 4px; line-height: 1.2;
  }
  .job-status-badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    margin-bottom: 16px;
  }
  .st-paid    { background: rgba(81,207,102,.18); color: #51cf66; }
  .st-sent    { background: rgba(116,185,255,.12); color: #74b9ff; }
  .st-due_soon { background: rgba(253,203,110,.18); color: #fdcb6e; }
  .st-overdue { background: rgba(255,107,107,.15); color: #ff6b6b; }

  /* Payment summary */
  .pay-summary {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .pay-box {
    flex: 1; min-width: 130px;
    background: var(--sf); border: 1px solid var(--bd); border-radius: 12px;
    padding: 14px 16px;
  }
  .pay-box .pb-label { font-size: 11px; color: var(--txd); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .pay-box .pb-val { font-size: 24px; font-weight: 900; }
  .pay-box.green .pb-val { color: #51cf66; }
  .pay-box.yellow .pb-val { color: #fdcb6e; }
  .pay-box.accent .pb-val { color: var(--ac); }

  /* Next payment banner */
  .next-payment-banner {
    background: var(--acd);
    border: 1px solid var(--ac);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .next-payment-banner .npb-icon { font-size: 24px; flex-shrink: 0; }
  .next-payment-banner .npb-text { font-size: 14px; line-height: 1.5; }
  .next-payment-banner .npb-text strong { color: var(--ac); font-size: 16px; }

  /* Milestone timeline */
  .timeline { position: relative; padding-inline-start: 32px; margin-bottom: 16px; }
  .timeline::before {
    content: '';
    position: absolute;
    inset-inline-start: 10px;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--bd);
  }
  .timeline-item {
    position: relative;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,.04);
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot {
    position: absolute;
    inset-inline-start: -26px;
    top: 14px;
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--bd);
    background: var(--bg);
  }
  .timeline-dot.done {
    background: #51cf66;
    border-color: #51cf66;
  }
  .timeline-dot.current {
    background: var(--ac);
    border-color: var(--ac);
    box-shadow: 0 0 0 4px var(--acd);
  }
  .timeline-name { font-size: 14px; font-weight: 600; }
  .timeline-amount { font-size: 13px; color: var(--txd); }
  .timeline-done-label { font-size: 11px; color: #51cf66; font-weight: 700; text-transform: uppercase; margin-inline-start: 6px; }

  /* Note */
  .note-box {
    background: var(--sf); border: 1px solid var(--bd); border-radius: 10px;
    padding: 12px 16px; font-size: 13px; color: var(--txd); line-height: 1.6;
    margin-bottom: 16px;
  }
  .note-box .note-label { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--ac); margin-bottom: 4px; font-weight: 700; }

  /* Pay Now button */
  .pay-now-btn {
    display: block; width: 100%; padding: 16px;
    background: var(--ac); color: var(--bg);
    font-size: 16px; font-weight: 700; text-align: center;
    border: none; border-radius: 12px; cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(232,197,71,.3);
    transition: opacity .15s, transform .1s;
    margin-bottom: 10px;
  }
  .pay-now-btn:hover { opacity: .9; transform: translateY(-1px); }
  .pay-now-btn:active { transform: translateY(0); }
  .pay-now-btn.disabled { background: var(--bd); color: var(--txd); cursor: default; box-shadow: none; }

  .pay-note { font-size: 12px; color: var(--txd); text-align: center; margin-bottom: 24px; }

  /* Loading skeleton */
  .skeleton { animation: shimmer 1.4s ease infinite; }
  .skeleton-line { height: 16px; border-radius: 6px; background: var(--sf); margin-bottom: 10px; }
  @keyframes shimmer {
    0%,100%{opacity:.5} 50%{opacity:1}
  }

  /* Error state */
  .error-state {
    text-align: center; padding: 60px 20px;
  }
  .error-state .err-icon { font-size: 56px; margin-bottom: 14px; }
  .error-state h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .error-state p { font-size: 14px; color: var(--txd); line-height: 1.6; }

  /* Powered footer */
  .js-footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: var(--txd);
    opacity: .45;
  }
  .js-footer a { color: var(--txd); text-decoration: none; }
  .js-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="js-page">
  <div class="js-brand">BQ <span>Tools · Powered by BQ Production</span></div>

  <div id="mainContent">
    <!-- Loading state -->
    <div id="loadingState" class="skeleton">
      <div class="skeleton-line" style="width:60%;margin:20px 0 6px;"></div>
      <div class="skeleton-line" style="width:40%;margin-bottom:20px;"></div>
      <div class="skeleton-line" style="height:80px;border-radius:12px;margin-bottom:12px;"></div>
      <div class="skeleton-line" style="height:60px;border-radius:12px;margin-bottom:12px;"></div>
      <div class="skeleton-line" style="height:120px;border-radius:12px;margin-bottom:12px;"></div>
    </div>

    <!-- Error state (hidden until needed) -->
    <div id="errorState" style="display:none;" class="error-state">
      <div class="err-icon">🔗</div>
      <h2>This job link is no longer active.</h2>
      <p>The link may have expired or been removed by the contractor.<br>Please contact them directly for an update.</p>
    </div>

    <!-- Job content (hidden until loaded) -->
    <div id="jobContent" style="display:none;"></div>
  </div>
</div>

<div class="js-footer">
  Powered by <a href="https://bqtools.dev" target="_blank">BQ Tools</a> &middot; BQ Production LLC &copy; 2026
</div>

<script>
const API = 'https://bq-tools-api.fanzai-mgmt.workers.dev';

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtMoney(n) {
  const v = parseFloat(n) || 0;
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function statusLabel(s) {
  const map = { paid: 'Paid in Full', sent: 'Invoice Sent', due_soon: 'Due Soon', overdue: 'Overdue' };
  return map[s] || s;
}

async function loadJob() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    showError();
    return;
  }

  try {
    const res = await fetch(`${API}/api/job/status?id=${encodeURIComponent(id)}`);
    const data = await res.json();

    if (!data.ok || !data.job) {
      showError();
      return;
    }

    renderJob(data.job);
  } catch (err) {
    showError();
  }
}

function showError() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorState').style.display = '';
}

function renderJob(job) {
  document.getElementById('loadingState').style.display = 'none';

  const c = job.contractor || {};
  const initials = (c.name || 'B')[0].toUpperCase();
  const status = job.status || 'sent';
  const milestones = job.milestones || [];
  const paid = parseFloat(job.paid) || 0;
  const amountDue = parseFloat(job.amount_due) || 0;
  const total = parseFloat(job.total) || 0;

  // Find the next unpaid milestone for the "pay now" CTA
  const nextMs = milestones.find(m => !m.done);
  const isFullyPaid = status === 'paid' || amountDue <= 0;

  // Milestone timeline HTML
  let msHtml = '';
  if (milestones.length > 0) {
    msHtml = `
      <div style="margin-bottom:16px;">
        <div style="font-size:12px;color:var(--txd);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:10px;">Payment Milestones</div>
        <div class="timeline">
          ${milestones.map((m, i) => {
            const isDone = m.done;
            const isCurrent = !isDone && (i === 0 || milestones.slice(0,i).every(x => x.done));
            const dotClass = isDone ? 'done' : (isCurrent ? 'current' : '');
            return `
              <div class="timeline-item">
                <div class="timeline-dot ${dotClass}"></div>
                <div class="timeline-name">
                  ${escHtml(m.name)}
                  ${isDone ? '<span class="timeline-done-label">✓ Done</span>' : ''}
                </div>
                ${m.amount ? `<div class="timeline-amount">${fmtMoney(m.amount)}</div>` : ''}
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  // Next payment banner
  let nextPaymentHtml = '';
  if (!isFullyPaid) {
    const nextAmt = nextMs ? parseFloat(nextMs.amount) || amountDue : amountDue;
    const nextName = nextMs ? nextMs.name : 'Remaining Balance';
    nextPaymentHtml = `
      <div class="next-payment-banner">
        <div class="npb-icon">📅</div>
        <div class="npb-text">
          <strong>${fmtMoney(nextAmt)}</strong> due for <em>${escHtml(nextName)}</em>
          ${job.due_date ? `<br>Due by <strong>${fmtDate(job.due_date)}</strong>` : ''}
        </div>
      </div>`;
  } else {
    nextPaymentHtml = `
      <div class="next-payment-banner" style="background:rgba(81,207,102,.1);border-color:rgba(81,207,102,.3);">
        <div class="npb-icon">🎉</div>
        <div class="npb-text" style="color:#51cf66;">
          <strong>Paid in Full</strong> — Thank you for your business!
        </div>
      </div>`;
  }

  // Note
  const noteHtml = job.last_note ? `
    <div class="note-box">
      <div class="note-label">Contractor Update</div>
      ${escHtml(job.last_note)}
    </div>` : '';

  // Pay Now button — placeholder for future Stripe link
  let payBtn = '';
  if (!isFullyPaid) {
    const contactHref = c.email
      ? `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent('Payment for ' + (job.job_name||'Job'))}&body=${encodeURIComponent('Hi ' + (c.name||'') + ',\n\nI would like to arrange payment for the project. Please let me know the best way to proceed.\n\nThank you.')}`
      : '#';
    payBtn = `
      <a href="${contactHref}" class="pay-now-btn">
        💳 Pay Now — Contact Contractor
      </a>
      <p class="pay-note">Online payments coming soon. Tap above to arrange payment via email.</p>`;
  } else {
    payBtn = `<div class="pay-now-btn disabled" style="pointer-events:none;">✅ All Paid — Nothing Due</div>`;
  }

  const html = `
    <div style="margin-bottom:16px;">
      <div class="job-title">${escHtml(job.job_name || 'Job Status')}</div>
      <span class="job-status-badge st-${status}">${statusLabel(status)}</span>
    </div>

    <div class="contractor-card">
      <div class="contractor-avatar">${initials}</div>
      <div class="contractor-info">
        <h2>${escHtml(c.name || 'Your Contractor')}</h2>
        <div class="contractor-contact">
          ${c.phone ? `<a href="tel:${escHtml(c.phone)}">📞 ${escHtml(c.phone)}</a>` : ''}
          ${c.email ? `<a href="mailto:${escHtml(c.email)}">✉️ ${escHtml(c.email)}</a>` : ''}
        </div>
      </div>
    </div>

    <div class="pay-summary">
      <div class="pay-box green">
        <div class="pb-label">Paid</div>
        <div class="pb-val">${fmtMoney(paid)}</div>
      </div>
      <div class="pay-box yellow">
        <div class="pb-label">Still Owed</div>
        <div class="pb-val">${fmtMoney(amountDue)}</div>
      </div>
      <div class="pay-box accent">
        <div class="pb-label">Total</div>
        <div class="pb-val">${fmtMoney(total)}</div>
      </div>
    </div>

    ${nextPaymentHtml}
    ${msHtml}
    ${noteHtml}
    ${payBtn}`;

  const content = document.getElementById('jobContent');
  content.innerHTML = html;
  content.style.display = '';

  // Update page title
  if (job.job_name) document.title = `${job.job_name} — Job Status`;
}

loadJob();
</script>
</body>
</html>
