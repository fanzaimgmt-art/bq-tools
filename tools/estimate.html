<style>
  body { display: flex; flex-direction: column; }
  .upload-area {
    border: 2px dashed var(--bd); border-radius: 10px; padding: 24px;
    text-align: center; cursor: pointer; transition: all .2s;
    position: relative; background: var(--sf); margin-bottom: 14px;
  }
  .upload-area:hover { border-color: var(--ac); }
  .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-area img { max-height: 200px; border-radius: 8px; }

  .estimate-result {
    background: var(--sf); border: 1px solid var(--bd); border-radius: 12px;
    padding: 20px; margin-top: 16px; display: none;
  }
  .estimate-result.on { display: block; animation: fadeIn .3s; }
  .est-section { margin-bottom: 14px; }
  .est-section h3 { font-size: 13px; color: var(--ac); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .est-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; background: var(--bg); border-radius: 6px; margin-bottom: 4px;
    font-size: 14px;
  }
  .est-row .est-label { color: var(--txd); }
  .est-row .est-val { font-weight: 700; }
  .est-total {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px; background: var(--acd); border: 1px solid rgba(232,197,71,.2);
    border-radius: 8px; font-size: 16px; font-weight: 700;
  }
  .est-total .est-range { color: var(--ac); font-size: 20px; }
  .disclaimer {
    font-size: 13px; color: var(--txd); margin-top: 12px; padding: 10px;
    background: var(--bg); border-radius: 6px; line-height: 1.5;
  }

  .pb-status {
    font-size: 13px; padding: 9px 12px; border-radius: 8px; margin-bottom: 12px;
    background: rgba(81,207,102,.08); border: 1px solid var(--grn); color: var(--grn); font-weight: 600;
  }
  .pb-status.pb-nudge {
    background: var(--acd); border-color: var(--ac); color: var(--txd); font-weight: 500;
  }
  .pb-status.pb-nudge a { color: var(--ac); font-weight: 700; text-decoration: underline; }

  @media (max-width: 600px) {
    .upload-area { padding: 16px; }
    .est-row { flex-direction: column; align-items: flex-start; gap: 2px; }
    .est-total { flex-direction: column; gap: 4px; }
    .est-total .est-range { font-size: 18px; }
  }
</style>

<script>
(async function(){
  try {
    if (typeof isLoggedIn !== 'function' || !isLoggedIn()) return;
    const data = await apiCall('/api/training/knowledge');
    const tip = document.getElementById('trainingTip');
    const text = document.getElementById('trainingTipText');
    const h = document.documentElement.lang === 'he';
    tip.style.display = 'block';
    if (data.knowledge?.trained) {
      tip.style.background = 'rgba(81,207,102,.08)';
      tip.style.borderColor = 'var(--grn)';
      text.innerHTML = h
        ? `<strong style="color:var(--grn);">✓ מאומן</strong> על ${data.knowledge.fileCount} מסמכים — ההערכה תשתמש במחירים שלך`
        : `<strong style="color:var(--grn);">✓ Trained</strong> on ${data.knowledge.fileCount} documents — estimate uses YOUR pricing`;
    } else {
      text.innerHTML = h
        ? `<a href="/training.html" style="color:var(--ac);">העלה חוזים ישנים</a> לקבלת הערכות אישיות המותאמות למחירים שלך`
        : `<a href="/training.html" style="color:var(--ac);">Upload past contracts</a> for personalized estimates using your pricing`;
    }
  } catch {}
})();
</script>
<script>
let photoSrc = null;

function handlePhotoUpload(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    photoSrc = ev.target.result;
    document.getElementById('uploadArea').innerHTML = `<img src="${photoSrc}"><input type="file" accept="image/*" id="photoInput">`;
    document.getElementById('photoInput').addEventListener('change', handlePhotoUpload);
  };
  r.readAsDataURL(f);
}
document.getElementById('photoInput').addEventListener('change', handlePhotoUpload);

// ── Price-book grounding (front-end only) ──
// Pulls the contractor's own /api/pricebook/search entries and folds them into the
// estimate prompt, same idea as Video Brain's pricebook grounding but auto-fetched
// instead of manually pasted.
const PB_STOPWORDS = new Set(['the','a','an','and','or','to','of','in','on','for','with','is','are','be','job','into','from','at','by','it','this','that','new','old','existing','need','needs','needed','replace','replacing','install','installing','installed','repair','repairing','repaired','fix','fixing','add','adding','remove','removing','build','building','my','our','some','all','full','complete','area','room']);

function extractPricebookKeywords(desc) {
  const words = String(desc || '').toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/).filter(Boolean);
  const uniq = [];
  for (const w of words) {
    if (w.length > 3 && !PB_STOPWORDS.has(w) && !uniq.includes(w)) uniq.push(w);
    if (uniq.length >= 3) break;
  }
  return uniq;
}

// Raw fetch, NOT apiCall — apiCall wipes the user's session on any 401, which is fine
// for a required call but wrong here: this is a best-effort lookup, so any failure
// (not logged in, expired token, network error, server error) must be silent and must
// never log the user out or interrupt the estimate they're mid-way through generating.
async function searchPriceBookSafe(q) {
  const token = getToken();
  if (!token) return null;
  try {
    const res = await fetch(`${API_URL}/api/pricebook/search?q=${encodeURIComponent(q)}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function getPriceBookGrounding(desc) {
  if (!isLoggedIn()) return [];
  const keywords = extractPricebookKeywords(desc);
  if (!keywords.length) return [];
  const responses = await Promise.all(keywords.map(searchPriceBookSafe));
  const seen = new Set();
  const items = [];
  for (const r of responses) {
    if (!r || !Array.isArray(r.items)) continue;
    for (const it of r.items) {
      const key = `${it.item}|${it.unit}|${it.price}|${it.region}`;
      if (seen.has(key)) continue;
      seen.add(key);
      items.push(it);
    }
  }
  return items.slice(0, 20);
}

function priceBookPromptLines(items) {
  return items.map(it => {
    const priceUnit = it.unit ? `$${it.price}/${it.unit}` : `$${it.price}`;
    return `[${it.item} — ${priceUnit}${it.region ? ' — ' + it.region : ''}]`;
  }).join('; ');
}

function priceBookStatusLine(groundedCount) {
  if (groundedCount > 0) {
    const n = groundedCount;
    return `<div class="pb-status" data-en="✓ Priced with the Obra price book — real contractor prices (${n} item${n !== 1 ? 's' : ''})" data-es="✓ Cotizado con el libro de precios de Obra — precios reales de contratistas (${n} artículo${n !== 1 ? 's' : ''})">✓ Priced with the Obra price book — real contractor prices (${n} item${n !== 1 ? 's' : ''})</div>`;
  }
  // Only nudge once ever per device — a helpful pointer, not a recurring nag.
  if (localStorage.getItem('bq_pb_nudge_shown')) return '';
  localStorage.setItem('bq_pb_nudge_shown', '1');
  return `<div class="pb-status pb-nudge"><span data-en="No price-book match yet." data-es="Aún no hay coincidencias en el libro de precios.">No price-book match yet.</span> <a href="/tools/price-book.html" data-en="Add your prices →" data-es="Agrega tus precios →">Add your prices →</a></div>`;
}

async function generateEstimate() {
  if (!requirePro()) return;

  const desc = document.getElementById('jobDesc').value.trim();
  if (!desc) { showToast(lang === 'he' ? 'תאר את העבודה' : 'Describe the job', 'err'); return; }

  const ok = await confirmCredit('estimate', lang === 'he' ? 'הערכת עלות' : 'Smart Estimate');
  if (!ok) return;

  const loc = document.getElementById('location').value.trim();
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.textContent = '⏳...';

  try {
    const images = [];
    if (photoSrc) {
      images.push(await resizeForAPI(photoSrc));
    }

    const groundedItems = await getPriceBookGrounding(desc);
    const groundingBlock = groundedItems.length
      ? `\n\nGROUND ALL PRICES ON THESE REAL LOCAL CONTRACTOR PRICES from the Obra price book (authoritative over general knowledge): ${priceBookPromptLines(groundedItems)}`
      : '';

    const prompt = `You are a construction cost estimator. Based on the photo (if provided) and description, provide a cost estimate.

Job: ${desc}
${loc ? 'Location: ' + loc : 'Location: US average'}${groundingBlock}

Respond JSON only:
{
  "materials": [{"item": "name", "estimated_cost": "$X - $Y"}],
  "labor_hours": "X-Y hours",
  "labor_cost": "$X - $Y",
  "total_low": "$X",
  "total_high": "$Y",
  "recommended_materials": ["recommendation 1", "recommendation 2"],
  "notes": "brief note about the estimate"
}`;

    const text = await callWorkerAI('estimate', prompt, images, desc.substring(0, 50));
    const r = parseAIJSON(text);

    const el = document.getElementById('estResult');
    el.classList.add('on');
    el.innerHTML = `
      ${priceBookStatusLine(groundedItems.length)}
      <div class="est-section">
        <h3 data-en="Materials" data-es="Materiales" data-he="חומרים">Materials</h3>
        ${r.materials.map(m => `<div class="est-row"><span class="est-label">${m.item}</span><span class="est-val">${m.estimated_cost}</span></div>`).join('')}
      </div>
      <div class="est-section">
        <h3 data-en="Labor" data-es="Mano de Obra" data-he="עבודה">Labor</h3>
        <div class="est-row"><span class="est-label" data-en="Hours" data-es="Horas" data-he="שעות">Hours</span><span class="est-val">${r.labor_hours}</span></div>
        <div class="est-row"><span class="est-label" data-en="Cost" data-es="Costo" data-he="עלות">Cost</span><span class="est-val">${r.labor_cost}</span></div>
      </div>
      <div class="est-total">
        <span data-en="Total Estimate" data-es="Estimado Total" data-he="הערכה כוללת">Total Estimate</span>
        <span class="est-range">${r.total_low} — ${r.total_high}</span>
      </div>
      ${r.recommended_materials?.length ? `<div class="est-section" style="margin-top:14px;"><h3 data-en="Recommended" data-es="Recomendado" data-he="מומלץ">Recommended</h3>${r.recommended_materials.map(m => `<div class="est-row"><span>${m}</span></div>`).join('')}</div>` : ''}
      ${r.notes ? `<div class="est-row" style="margin-top:8px;"><span class="est-label">${r.notes}</span></div>` : ''}
      <div class="disclaimer" data-en="⚠️ This is an AI estimate for reference only. Final costs may vary based on actual conditions, material availability, and local labor rates. Always get multiple quotes from licensed contractors." data-es="⚠️ Este es un estimado de IA solo de referencia. Los costos finales pueden variar según las condiciones reales, disponibilidad de materiales y tarifas locales de mano de obra. Siempre obtén varias cotizaciones de contratistas con licencia." data-he="⚠️ זוהי הערכת AI לייחוס בלבד. עלויות סופיות עשויות להשתנות. קבל תמיד מספר הצעות מקבלנים מורשים.">⚠️ This is an AI estimate for reference only. Final costs may vary based on actual conditions, material availability, and local labor rates.</div>`;

    setLang(lang);
    showToast(lang === 'he' ? 'הערכה מוכנה!' : 'Estimate ready!', 'ok');

  } catch(err) {
    showToast('Error: ' + err.message, 'err');
  }

  btn.disabled = false;
  btn.textContent = lang === 'he' ? '🧠 צור הערכה' : '🧠 Generate Estimate';
}
</script>
