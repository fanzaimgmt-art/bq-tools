<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Project Schedule</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#08080d;--sf:#141418;--tx:#f5f1e8;--txd:#9a958c;--ac:#e8c547;--bd:rgba(255,255,255,.08);--ok:#7dd87d}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;min-height:100dvh;padding:22px 16px 60px;line-height:1.5}
  body.rtl{font-family:'Heebo','Inter',sans-serif;direction:rtl}
  .wrap{max-width:560px;margin:0 auto}
  .card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;overflow:hidden}
  .top{padding:26px 24px 22px;background:linear-gradient(160deg,rgba(232,197,71,.1),transparent 60%);border-bottom:1px solid var(--bd)}
  .biz{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .biz img{width:44px;height:44px;border-radius:11px;object-fit:cover;background:var(--bg)}
  .biz .bn{font-weight:700;font-size:15px}
  .biz .bp{color:var(--txd);font-size:13px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);opacity:.85}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;letter-spacing:-.01em;margin:8px 0 4px;text-wrap:balance}
  .addr{color:var(--txd);font-size:13.5px}
  .body{padding:22px 24px}
  .tl{position:relative;margin:4px 0 8px;padding-inline-start:26px}
  .tl::before{content:"";position:absolute;inset-inline-start:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--ac),rgba(232,197,71,.15))}
  .ms{position:relative;padding:0 0 20px}
  .ms::before{content:"";position:absolute;inset-inline-start:-26px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--ac)}
  .ms.done::before{background:var(--ac)}
  .ms .mt{font-weight:700;font-size:15px}
  .ms .md{color:var(--ac);font-size:13px;font-weight:600;margin-top:2px}
  .ms .mn{color:var(--txd);font-size:13px;margin-top:3px}
  .cta{background:var(--ac);color:#1a1407;font-weight:800;border:none;border-radius:100px;padding:15px;width:100%;font-size:15.5px;font-family:inherit;cursor:pointer;text-decoration:none;display:block;text-align:center;margin-top:6px}
  .cta:active{transform:translateY(1px)}
  .cta.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd);margin-top:10px;font-weight:600}
  .approved{background:rgba(125,216,125,.1);border:1px solid rgba(125,216,125,.4);border-radius:12px;padding:15px;text-align:center;color:var(--ok);font-weight:600;margin-top:6px}
  .foot{text-align:center;color:var(--txd);font-size:11.5px;margin-top:20px}
  .foot a{color:var(--txd)}
  .langs{text-align:center;margin-bottom:14px}
  .langs button{background:none;border:0;color:var(--txd);font-size:12px;cursor:pointer;padding:4px 8px;font-family:inherit}
  .langs button.on{color:var(--ac);font-weight:700}
  .msg{text-align:center;color:var(--txd);padding:50px 20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="langs">
    <button data-l="en" onclick="setL('en')">EN</button>
    <button data-l="es" onclick="setL('es')">ES</button>
    <button data-l="he" onclick="setL('he')">עב</button>
  </div>
  <div id="root"><div class="msg" data-i="loading">Loading your schedule…</div></div>
  <div class="foot">
    <span data-i="poweredPre">Scheduled with</span> <a href="https://obra.build" target="_blank" rel="noopener">Obra</a>
  </div>
</div>

<script>
const API = 'https://bq-tools-api.fanzai-mgmt.workers.dev';
const T = {
  loading:{en:'Loading your schedule…',es:'Cargando tu calendario…',he:'טוען את לוח הזמנים…'},
  notfound:{en:'This schedule link is invalid or was removed.',es:'Este enlace no es válido o fue eliminado.',he:'הקישור לא תקין או הוסר.'},
  eyebrow:{en:'Your project schedule',es:'Tu calendario de proyecto',he:'לוח הזמנים של הפרויקט שלך'},
  addcal:{en:'📅 Add these dates to my calendar',es:'📅 Agregar estas fechas a mi calendario',he:'📅 הוסף את התאריכים ליומן שלי'},
  approve:{en:'✓ Approve this schedule',es:'✓ Aprobar este calendario',he:'✓ אשר את לוח הזמנים'},
  approvedPre:{en:'You approved this schedule',es:'Aprobaste este calendario',he:'אישרת את לוח הזמנים'},
  noDates:{en:'Your contractor is still finalizing the dates.',es:'Tu contratista aún está finalizando las fechas.',he:'הקבלן עדיין מסיים את התאריכים.'},
  poweredPre:{en:'Scheduled with',es:'Programado con',he:'נוצר עם'},
  tapAdd:{en:'One tap adds every milestone to your phone.',es:'Un toque agrega cada hito a tu teléfono.',he:'הקשה אחת מוסיפה כל שלב לטלפון שלך.'},
};
let L = (localStorage.getItem('obra_client_lang') || (navigator.language||'en').slice(0,2));
if(!['en','es','he'].includes(L)) L='en';
const tok = new URLSearchParams(location.search).get('t') || '';
let DATA = null;

function tr(k){ return (T[k]&&(T[k][L]||T[k].en))||''; }
function setL(l){ L=l; localStorage.setItem('obra_client_lang',l); document.body.classList.toggle('rtl',l==='he'); document.documentElement.lang=l; document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l)); render(); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// Only allow https image URLs in the logo src — blocks javascript:/data: and attribute-breakout payloads.
function safeImg(u){ u=String(u||''); return /^https:\/\/[^"'<>\s]+$/.test(u) ? u : ''; }
function fmtDate(d){ if(!d) return ''; try{ return new Date(d+'T00:00:00').toLocaleDateString(L==='he'?'he-IL':L==='es'?'es-MX':'en-US',{weekday:'short',month:'short',day:'numeric'}); }catch(e){ return d; } }

async function load(){
  if(!/^[a-f0-9]{32}$/.test(tok)){ document.getElementById('root').innerHTML='<div class="msg">'+tr('notfound')+'</div>'; return; }
  try{
    const r = await fetch(API+'/api/public/project?t='+tok);
    if(!r.ok) throw 0;
    DATA = await r.json();
    render();
  }catch(e){ document.getElementById('root').innerHTML='<div class="msg">'+tr('notfound')+'</div>'; }
}
function render(){
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
  document.body.classList.toggle('rtl',L==='he'); document.documentElement.lang=L;
  document.querySelector('.foot [data-i="poweredPre"]').textContent = tr('poweredPre');
  if(!DATA){ return; }
  const c = DATA.contractor||{};
  const miles = (DATA.schedule||[]).slice().sort((a,b)=>(a.date||'9')<(b.date||'9')?-1:1);
  const approved = !!DATA.approvedAt;
  const logoUrl = safeImg(c.logo);
  const logo = logoUrl ? `<img src="${esc(logoUrl)}" alt="">` : `<div style="width:44px;height:44px;border-radius:11px;background:var(--ac);color:#1a1407;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Space Grotesk'">${esc((c.businessName||'B')[0])}</div>`;
  const tl = miles.length ? `<div class="tl">${miles.map(m=>`<div class="ms ${m.done?'done':''}">
      <div class="mt">${esc(m.title)}</div>
      ${m.date?`<div class="md">${fmtDate(m.date)}</div>`:''}
      ${m.note?`<div class="mn">${esc(m.note)}</div>`:''}
    </div>`).join('')}</div>` : `<div class="msg" style="padding:24px 0">${tr('noDates')}</div>`;
  const hasDates = miles.some(m=>m.date);
  document.getElementById('root').innerHTML = `<div class="card">
    <div class="top">
      <div class="biz">${logo}<div><div class="bn">${esc(c.businessName||'Your contractor')}</div>${c.phone?`<div class="bp">${esc(c.phone)}</div>`:''}</div></div>
      <div class="eyebrow">${tr('eyebrow')}</div>
      <h1>${esc(DATA.name||'')}</h1>
      ${DATA.address?`<div class="addr">📍 ${esc(DATA.address)}</div>`:''}
    </div>
    <div class="body">
      ${tl}
      ${hasDates?`<div style="color:var(--txd);font-size:12.5px;text-align:center;margin:2px 0 12px">${tr('tapAdd')}</div>
      <a class="cta" href="${API}/api/public/project/calendar?t=${tok}">${tr('addcal')}</a>`:''}
      ${approved
        ? `<div class="approved">✓ ${tr('approvedPre')}</div>`
        : (miles.length?`<button class="cta ghost" id="apprBtn" onclick="approve()">${tr('approve')}</button>`:'')}
    </div>
  </div>`;
}
async function approve(){
  const b=document.getElementById('apprBtn'); if(b){b.disabled=true;b.textContent='…';}
  try{ const r=await fetch(API+'/api/public/project/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:tok})}); if(r.ok){ DATA.approvedAt=new Date().toISOString(); render(); } }
  catch(e){ if(b){b.disabled=false;b.textContent=tr('approve');} }
}
setL(L);
load();
</script>
</body>
</html>
