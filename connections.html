<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connections — Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0f12;--sf:#191b21;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--tx:#f3f3f0;--mut:#9a9da7;--ac:#e8c547;--good:#36c47a;--font-body:'Inter',system-ui,sans-serif;--font-display:'Space Grotesk',system-ui,sans-serif;}
  [dir="rtl"]{--font-body:'Heebo','Inter',system-ui,sans-serif;}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--tx);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--font-display)}
  .wrap{max-width:640px;margin:0 auto;padding:26px 16px 80px}
  .top a{color:var(--mut);text-decoration:none;font-size:14px}
  h1{font-size:26px;margin:8px 0 4px}.sub{color:var(--mut);font-size:14px;margin:0 0 22px;max-width:50ch}
  .banner{display:none;border-radius:12px;padding:12px 15px;font-size:14px;margin-bottom:18px}
  .banner.ok{display:block;background:rgba(54,196,122,.12);border:1px solid rgba(54,196,122,.3);color:#bff0d4}
  .banner.err{display:block;background:rgba(224,102,74,.12);border:1px solid rgba(224,102,74,.3);color:#f3c3b8}
  .card{display:flex;gap:14px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
  .card .ic{width:46px;height:46px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--bg)}
  .card .t{flex:1;min-width:0}.card .t b{font-size:16px;display:block}.card .t span{color:var(--mut);font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;margin-top:4px}
  .badge.on{background:rgba(54,196,122,.14);color:var(--good)}
  .badge.off{background:rgba(255,255,255,.05);color:var(--mut)}
  .badge.setup{background:rgba(216,178,76,.14);color:var(--ac)}
  .btn{border:1px solid var(--line2);background:var(--ac);color:#1a1407;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;flex:0 0 auto}
  .btn.ghost{background:transparent;color:var(--mut)}
  .btn:disabled{opacity:.5;cursor:default}
  .note{color:var(--mut);font-size:12.5px;margin-top:20px;line-height:1.6;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/home">← Home</a></div>
  <h1 id="h1">Connections</h1>
  <p class="sub" id="sub">Connect your accounts so Tony can save documents, send emails, and sync your work automatically — per project.</p>
  <div class="banner" id="banner"></div>
  <div id="list"><div style="color:var(--mut);padding:20px">Loading…</div></div>
  <div class="note" id="adminNote" style="display:none"></div>
</div>
<script>
const API='https://bq-tools-api.fanzai-mgmt.workers.dev';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lang=(localStorage.getItem('bq_lang')||'en');const RTL=['he','fa','ar'].includes(lang);if(RTL)document.documentElement.dir='rtl';
const token=()=>localStorage.getItem('bq_token')||'';
const META={google:{icon:'🔷',name:'Google',desc:RTL?'Drive (שמירת מסמכים) + Gmail (שליחת מיילים)':'Drive (save documents) + Gmail (send emails)'},
  dropbox:{icon:'📦',name:'Dropbox',desc:RTL?'שמירת קבצים ל-Dropbox':'Save files to Dropbox'}};
const TXT=RTL?{h:'חיבורים',sub:'חבר את החשבונות שלך כדי שטוני יוכל לשמור מסמכים, לשלוח מיילים ולסנכרן — לכל פרויקט.',conn:'מחובר',notconn:'לא מחובר',setup:'דורש הגדרה',connect:'חבר',disc:'נתק',okmsg:'✓ חובר בהצלחה!',errmsg:'משהו השתבש בחיבור — נסה שוב.'}
  :{h:'Connections',sub:'Connect your accounts so Tony can save documents, send emails and sync — per project.',conn:'Connected',notconn:'Not connected',setup:'Needs setup',connect:'Connect',disc:'Disconnect',okmsg:'✓ Connected!',errmsg:'Something went wrong connecting — try again.'};
$('#h1').textContent=TXT.h;$('#sub').textContent=TXT.sub;

const params=new URLSearchParams(location.search);
// Google callback bounces code+state here; the logged-in browser redeems via POST /finish (CSRF-safe session binding).
if(params.get('gc')&&params.get('gs')){
  (async()=>{ try{
    const r=await fetch(API+'/api/connections/google/finish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token()},body:JSON.stringify({code:params.get('gc'),state:params.get('gs')})});
    const d=await r.json();
    const b=$('#banner'); if(d.ok){ b.className='banner ok'; b.textContent=TXT.okmsg; } else { b.className='banner err'; b.textContent=TXT.errmsg; }
  }catch(e){ const b=$('#banner');b.className='banner err';b.textContent=TXT.errmsg; }
  history.replaceState(null,'',location.pathname); load();
  })();
}
else if(params.get('connected')){ const b=$('#banner');b.className='banner ok';b.textContent=TXT.okmsg; }
else if(params.get('err')){ const b=$('#banner');b.className='banner err';b.textContent=TXT.errmsg; }

async function load(){
  try{
    const r=await fetch(API+'/api/connections',{headers:{'Authorization':'Bearer '+token()}});
    const d=await r.json();
    let anyUnconfigured=false;
    $('#list').innerHTML=(d.providers||[]).map(p=>{
      const m=META[p.provider]||{icon:'🔌',name:p.provider,desc:''};
      let badge,btn;
      if(!p.configured){ anyUnconfigured=true; badge=`<span class="badge setup">⚙ ${TXT.setup}</span>`; btn=`<button class="btn" disabled>${TXT.connect}</button>`; }
      else if(p.connected){ badge=`<span class="badge on">● ${TXT.conn}</span>`; btn=`<button class="btn ghost" data-disc="${p.provider}">${TXT.disc}</button>`; }
      else { badge=`<span class="badge off">○ ${TXT.notconn}</span>`; btn=`<button class="btn" data-conn="${p.provider}">${TXT.connect}</button>`; }
      return `<div class="card"><div class="ic">${m.icon}</div><div class="t"><b>${esc(m.name)}</b><span>${esc(m.desc)}</span><br>${badge}</div>${btn}</div>`;
    }).join('');
    document.querySelectorAll('[data-conn]').forEach(b=>b.onclick=()=>connect(b.dataset.conn));
    document.querySelectorAll('[data-disc]').forEach(b=>b.onclick=()=>disconnect(b.dataset.disc));
    if(anyUnconfigured){ const n=$('#adminNote');n.style.display='block';
      n.innerHTML=RTL?'⚙ <b>חיבורים מסומנים "דורש הגדרה"</b> מחכים ל-OAuth credentials של הספק. ברגע שמשה ייצור אפליקציית Google Cloud ויוסיף את המפתחות, הכפתורים יידלקו.'
      :'⚙ <b>Providers marked "Needs setup"</b> are waiting for the provider OAuth credentials. Once the Google Cloud app + keys are added, the buttons light up.'; }
  }catch(e){ $('#list').innerHTML='<div style="color:var(--mut);padding:20px">—</div>'; }
}
async function connect(p){
  if(p!=='google'){alert('Coming soon');return;}
  try{ const r=await fetch(API+'/api/connections/google/start',{headers:{'Authorization':'Bearer '+token()}}); const d=await r.json();
    if(d.url){ location.href=d.url; } else { alert(d.error||'Not ready'); } }catch(e){ alert('Error'); }
}
async function disconnect(p){
  try{ await fetch(API+'/api/connections/disconnect',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token()},body:JSON.stringify({provider:p})}); }catch(e){}
  load();
}
load();
</script>
</body>
</html>
